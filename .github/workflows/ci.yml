name: CI

on:
  push:
  pull_request:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and test /core
        working-directory: core
        run: |
          if [ -f package.json ]; then
            npm install
            npm test --if-present
          else
            echo "no /core package.json yet — skipping"
          fi

  web-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and build /web
        working-directory: web
        run: |
          npm install
          npm run build
